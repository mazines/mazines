<!-- Rainbow fill that moves across the art. The gradient repeats every art
     width and starts and ends on one color, so the loop has no seam. -->
<defs>
<linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="22" y1="0" x2="526.0" y2="0" spreadMethod="repeat">
<stop offset="0.000" stop-color="#ff6b6b"/>
