<stop offset="0.833" stop-color="#b18bff"/>
<stop offset="1.000" stop-color="#ff6b6b"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="504.0 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
